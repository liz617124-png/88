<!DOCTYPE html>

<head>

  <title>艸田 空間 Tsao Tian Space</title>
  <!-- Tailwind CSS -->

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<body class="bg-amber-50/30 text-stone-800">

      { id: 2, name: "溫馨家常早午餐", category: "main", price: 220, desc: "包含手作麵包、小農沙拉、半熟蛋與私房主菜，滿滿溫暖家常味。", popular: false, tag: "早午餐" },

      { id: 4, name: "新鮮特調牧草汁", category: "drink", price: 120, desc: "嚴選在地新鮮牧草與特調蔬果調配，口感清爽回甘健康自然。", popular: true, tag: "獨家推薦" },

      { id: 1, title: "老宅客廳一角", tag: "老宅空間", img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&q=80&w=800" },

      const [currentPage, setCurrentPage] = useState('home');
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [showBookingSuccess, setShowBookingSuccess] = useState(false);
      const [catMessage, setCatMessage] = useState('');
      const [cookingGuests, setCookingGuests] = useState(4);
      const [needIngredients, setNeedIngredients] = useState(true);

        const handleScroll = () => {
          setIsScrolled(window.scrollY > 30);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const navigateTo = (pageId) => {
        setCurrentPage(pageId);
        setMobileMenuOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleCatClick = () => {
        const catQuotes = [
          "喵～歡迎來到艸田，找個喜歡的角落坐坐吧！",
          "這裡沒有急促的時間，曬曬太陽喝杯咖啡吧 ฅ'ω'ฅ",
          "今天想下廚還是喝杯特調牧草汁呢？"
        ];
        const randomQuote = catQuotes[Math.floor(Math.random() * catQuotes.length)];
        setCatMessage(randomQuote);
        setTimeout(() => setCatMessage(''), 4000);
      };

      const filteredMenu = selectedCategory === 'all'
        ? menuData
        : menuData.filter(item => item.category === selectedCategory);

                <span className="block text-xs text-amber-700/80 font-mono tracking-widest uppercase">Tsao Tian Space</span>
              </button>
              <nav className="hidden md:flex items-center space-x-8 text-sm tracking-widest font-medium">
                {[
                  { id: 'home', label: '首頁' },
                  { id: 'about', label: '關於艸田' },
                  { id: 'menu', label: '特色菜單' },
                  { id: 'space', label: '空間導覽' },
                  { id: 'contact', label: '預約與聯絡' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => navigateTo(tab.id)}
                    className={`transition-all py-1 border-b-2 ${currentPage === tab.id ? 'border-amber-700 text-amber-900 font-bold' : 'border-transparent text-stone-600 hover:text-amber-800'}`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>
              <div className="hidden md:block">
                <button
                  onClick={() => navigateTo('contact')}
                  className="bg-amber-800 hover:bg-amber-900 active:scale-95 text-amber-50 text-xs tracking-widest px-4 py-2.5 rounded-full transition-all shadow-sm hover:shadow"
                >
                  預約共煮 / 用餐
                </button>
              </div>
              <button
                className="md:hidden text-amber-950 p-2"
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
              >
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  {mobileMenuOpen ? (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                  ) : (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                  )}

            </div>

                  { id: 'contact', label: '預約與聯絡' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => navigateTo(tab.id)}
                    className={`text-left py-2 text-sm tracking-widest ${currentPage === tab.id ? 'font-bold text-amber-900' : 'text-stone-600'}`}

                    {tab.label}

                      走進艸田，這裡不只是喝手沖咖啡的地方。充滿收藏痕跡的溫馨空間、植物天井、可愛店貓，以及獨特的私廚共煮體驗，邀請您來放慢生活步調。

                    <div className="pt-4 flex flex-wrap gap-4 justify-center md:justify-start">

                        onClick={() => navigateTo('about')}

                      </button>
                      <button
                        onClick={() => navigateTo('menu')}
                        className="border border-stone-400 hover:border-amber-800 text-stone-700 hover:text-amber-800 px-6 py-3 rounded-full text-sm tracking-widest transition-all"
                      >
                        探索家常菜單
                      </button>
                    </div>
                  </div>
                  <div className="flex-1 relative w-full">
                    <img
                      src="https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&q=80&w=800"
                      alt="艸田空間"
                      className="rounded-2xl shadow-xl w-full object-cover h-80 md:h-[400px]"

                  </div>
                </section>

                {/* Featured Menu Teaser */}
                <section className="max-w-6xl mx-auto px-6 space-y-10">
                  <div className="text-center space-y-2">
                    <h2 className="text-2xl md:text-3xl font-bold text-stone-800">精選家常味</h2>
                    <p className="text-xs text-stone-500 tracking-widest">FEATURED MENU</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {menuData.filter(i => i.popular).map(item => (
                      <div key={item.id} className="bg-white p-6 rounded-xl shadow-sm border border-stone-100 hover:shadow-md transition-all hover:-translate-y-1">
                        <span className="text-[10px] bg-amber-100 text-amber-900 px-2.5 py-1 rounded-full">{item.tag}</span>
                        <h3 className="font-bold text-lg text-stone-800 mt-3">{item.name}</h3>
                        <p className="text-xs text-stone-500 mt-2 leading-relaxed">{item.desc}</p>
                        <div className="mt-4 font-mono font-bold text-amber-900">NT$ {item.price}</div>
                      </div>
                    ))}
                  </div>
                  <div className="text-center">
                    <button
                      onClick={() => navigateTo('menu')}
                      className="border border-amber-800 text-amber-900 px-6 py-2.5 rounded-full text-xs tracking-widest hover:bg-amber-800 hover:text-amber-50 transition-all"
                    >
                      查看完整菜單 (Menu)
                    </button>
                  </div>
                </section>
              </div>
            )}

            {/* PAGE: ABOUT */}
            {currentPage === 'about' && (
              <div className="max-w-4xl mx-auto px-6 py-8 space-y-16">
                <div className="space-y-4 text-center">
                  <span className="text-xs text-amber-800 tracking-widest font-mono">ABOUT TSAO TIAN</span>
                  <h1 className="text-3xl md:text-4xl font-bold text-stone-800">關於 艸田 空間</h1>
                  <p className="text-stone-600 text-sm max-w-xl mx-auto">

                  </p>
                </div>

                <div className="space-y-8 bg-white p-8 rounded-2xl border border-amber-100 shadow-sm">
                  <h2 className="text-xl font-bold text-amber-900 border-l-4 border-amber-800 pl-3">核心客群族群</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
                    <div className="p-4 bg-amber-50/50 rounded-xl space-y-2">
                      <h3 className="font-bold text-stone-800 text-sm">藝文與獨立創作者</h3>
                      <p className="text-xs text-stone-600 leading-relaxed">吸引喜愛藝術、設計、手作選物與獨立文化的自由職業者與創作者來此尋找靈感。</p>
                    </div>
                    <div className="p-4 bg-amber-50/50 rounded-xl space-y-2">

                      <p className="text-xs text-stone-600 leading-relaxed">沒有冰冷的規則，像去老朋友家客廳聊天放鬆，享受濃濃的人情味與私房餐點。</p>
                    </div>
                    <div className="p-4 bg-amber-50/50 rounded-xl space-y-2">
                      <h3 className="font-bold text-stone-800 text-sm">私廚體驗小團體</h3>
                      <p className="text-xs text-stone-600 leading-relaxed">喜歡帶著食材前來共享廚房下廚，或是預約包場進行聚會活動的溫馨團體。</p>
                    </div>
                  </div>
                </div>

                <div className="space-y-6">

                    <div className="bg-white p-6 rounded-xl border border-stone-200">

                      </p>
                    </div>
                    <div className="bg-white p-6 rounded-xl border border-stone-200">
                      <h3 className="font-bold text-amber-900 text-base mb-1">02. 「共煮與私廚體驗」人際交流機能</h3>
                      <p className="text-xs text-stone-600 leading-relaxed">
                        艸田不僅僅提供餐點，更提供完善的廚房共享設備與食材代購服務。您可以約上三五好友，一起在這裡料理美味、分享生活的歡笑。
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* PAGE: MENU */}
            {currentPage === 'menu' && (
              <div className="max-w-4xl mx-auto px-6 py-8 space-y-10">
                <div className="text-center space-y-3">
                  <h1 className="text-3xl font-bold text-stone-800">家常私房菜單</h1>
                  <p className="text-xs text-stone-500">以手作溫度用心調製每一份餐點與飲品</p>
                </div>

                {/* Filter */}
                <div className="flex justify-center space-x-3">
                  {[
                    { id: 'all', label: '全部品項' },
                    { id: 'main', label: '家常餐食' },
                    { id: 'dessert', label: '手作甜點' },
                    { id: 'drink', label: '特調飲品' }
                  ].map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => setSelectedCategory(cat.id)}
                      className={`px-4 py-2 rounded-full text-xs tracking-wider transition-all ${selectedCategory === cat.id ? 'bg-amber-900 text-amber-50 shadow' : 'bg-white text-stone-600 border border-stone-200 hover:border-amber-700'}`}
                    >
                      {cat.label}
                    </button>
                  ))}
                </div>

                {/* Items */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                  {filteredMenu.map(item => (
                    <div key={item.id} className="bg-white p-6 rounded-xl border border-amber-100/80 shadow-sm flex flex-col justify-between hover:shadow-md transition-all">
                      <div>
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-base text-stone-800">{item.name}</span>
                          <span className="font-mono font-bold text-amber-900 text-sm">NT$ {item.price}</span>
                        </div>
                        <span className="inline-block mt-1 text-[10px] text-amber-800 bg-amber-50 px-2 py-0.5 rounded border border-amber-200/50">{item.tag}</span>
                        <p className="text-xs text-stone-500 mt-3 leading-relaxed">{item.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PAGE: SPACE GALLERY */}
            {currentPage === 'space' && (
              <div className="max-w-5xl mx-auto px-6 py-8 space-y-12">
                <div className="text-center space-y-3">
                  <h1 className="text-3xl font-bold text-stone-800">空間導覽與氛圍</h1>
                  <p className="text-xs text-stone-500">走進台中育德路巷弄，感受老宅與綠意交織的安穩角落</p>
                </div>

                {/* Interactive Cat Banner */}
                <div className="bg-amber-100/60 p-6 rounded-2xl border border-amber-200 flex flex-col sm:flex-row items-center gap-6">
                  <div 
                    onClick={handleCatClick}
                    className="w-16 h-16 bg-amber-800 text-white rounded-full flex items-center justify-center font-bold text-2xl shadow-md cursor-pointer hover:scale-105 transition-transform"

                    🐱

                  <div className="flex-1 text-center sm:text-left space-y-1">
                    <div className="font-bold text-stone-800 text-sm">點擊店貓頭像，聽聽牠想說什麼！</div>
                    <div className="text-xs text-stone-600">店內有溫柔的陪伴貓咪，請在造訪時保持溫柔互動。</div>
                    {catMessage && (
                      <div className="mt-2 bg-white px-4 py-2 rounded-lg text-amber-900 text-xs font-bold shadow-sm inline-block animate-bounce">
                        {catMessage}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <img src={img.img} alt={img.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                        <span className="absolute top-3 right-3 bg-stone-900/70 text-white text-[10px] px-2.5 py-1 rounded-full backdrop-blur">{img.tag}</span>
                      </div>
                      <div className="p-4">
                        <h3 className="font-bold text-stone-800 text-sm">{img.title}</h3>
                      </div>
                    </div>
                  ))}

              </div>

                    </div>

                    {/* Interactive Calculator */}
                    <div className="pt-4 border-t space-y-3 bg-amber-50/50 p-4 rounded-xl">
                      <div className="font-bold text-amber-900 text-xs">私廚共煮費用估算器：</div>
                      <div className="flex items-center space-x-3 text-xs">
                        <span>人數：</span>
                        <input
                          type="range"
                          min="2"
                          max="12"
                          value={cookingGuests}
                          onChange={(e) => setCookingGuests(Number(e.target.value))}
                          className="w-32 accent-amber-800"
                        />
                        <span className="font-bold font-mono">{cookingGuests} 人</span>
                      </div>
                      <div className="flex items-center space-x-2 text-xs">
                        <input
                          type="checkbox"
                          id="ing"
                          checked={needIngredients}
                          onChange={(e) => setNeedIngredients(e.target.checked)}
                          className="accent-amber-800"
                        />
                        <label htmlFor="ing">包含店主協助代購季節食材</label>
                      </div>
                      <div className="text-xs text-stone-700 font-mono font-bold pt-1">
                        估算總額：NT$ {cookingGuests * (needIngredients ? 350 : 200)} 元起
                      </div>
                    </div>
                  </div>

                  {/* Booking Form */}
                  <div className="bg-white p-8 rounded-2xl border border-stone-200 space-y-4">
                    <h2 className="font-bold text-stone-800 text-lg border-b pb-3">線上預約單</h2>
                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        setShowBookingSuccess(true);
                      }}
                      className="space-y-4 text-xs"
                    >
                      <div>
                        <label className="block text-stone-700 mb-1 font-medium">您的姓名</label>
                        <input required type="text" placeholder="例：王小明" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-800" />
                      </div>
                      <div>
                        <label className="block text-stone-700 mb-1 font-medium">聯絡電話</label>
                        <input required type="tel" placeholder="0912-345-678" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-800" />
                      </div>
                      <div>
                        <label className="block text-stone-700 mb-1 font-medium">預約項目</label>
                        <select className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-800 bg-white">
                          <option>一般座位預約（飲品／餐點）</option>
                          <option>私廚共煮廚房體驗</option>
                          <option>藝文空間租借／展演洽詢</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-stone-700 mb-1 font-medium">預約日期與時間</label>
                        <input required type="datetime-local" className="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-800" />
                      </div>
                      <button
                        type="submit"
                        className="w-full bg-amber-800 hover:bg-amber-900 active:scale-95 text-amber-50 font-bold py-3 rounded-lg transition-all shadow"
                      >
                        送出預約申請
                      </button>
                    </form>
                  </div>
                </div>

                {/* Modal */}
                {showBookingSuccess && (
                  <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white max-w-sm w-full p-6 rounded-2xl shadow-xl text-center space-y-4 animate-scaleUp">
                      <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-2xl mx-auto">✓</div>
                      <h3 className="font-bold text-lg text-stone-800">預約申請已送出！</h3>
                      <p className="text-xs text-stone-600 leading-relaxed">
                        感謝您預約艸田空間，我們將於營業時間內盡快與您電話確認保留細節。
                      </p>
                      <button
                        onClick={() => setShowBookingSuccess(false)}
                        className="bg-amber-800 text-amber-50 px-6 py-2 rounded-full text-xs font-bold hover:bg-amber-900"
                      >
                        好的，了解
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-stone-900 text-stone-400 py-10 text-xs">
            <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                <div className="font-bold text-stone-200 text-base">艸田 空間 Tsao Tian Space</div>
                <div className="mt-1">台中市北區育德路巷弄內 ‧ 藝文共煮複合式空間</div>
              </div>
              <div className="text-stone-500 text-[11px]">
                &copy; {new Date().getFullYear()} 艸田 空間. All rights reserved.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
